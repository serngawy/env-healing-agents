apiVersion: v1
kind: Namespace
metadata:
  name: env-healing-agents-ns

---
# ---------------------------------------------------------------------------
# known_issues.json
# Add patterns for your environment here, or let the AI agent discover and
# persist them automatically at runtime.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-healing-agents-known-issues-1
  namespace: env-healing-agents-ns
  labels:
    app: env-healing-agents
    knowledge-base: known-issues
data:
  data.json: |
    {
      "version": "1.0.0",
      "description": "Known issues and error patterns — add entries for your environment",
      "patterns": []
    }

---
# ---------------------------------------------------------------------------
# fix_strategies.json
# Add fix strategies for your environment here.
# log_and_continue is the built-in fallback used when no specific fix is found.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-healing-agents-fix-strategies-1
  namespace: env-healing-agents-ns
  labels:
    app: env-healing-agents
    knowledge-base: fix-strategies
data:
  data.json: |
    {
      "version": "1.0.0",
      "description": "Fix strategies — add entries for your environment",
      "fix_strategies": {
        "log_and_continue": {
          "name": "Log and Continue",
          "description": "Log the issue for review and continue execution.",
          "automated": true,
          "action_type": "advisory",
          "parameters": [],
          "action": {
            "message": "Issue logged for review — execution continues",
            "success": true
          }
        }
      }
    }

---
# ---------------------------------------------------------------------------
# remediation_outcomes.json
# Populated at runtime by the learning agent — do not edit manually.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-healing-agents-remediation-outcomes-1
  namespace: env-healing-agents-ns
  labels:
    app: env-healing-agents
    knowledge-base: remediation-outcomes
data:
  data.json: "[]"

